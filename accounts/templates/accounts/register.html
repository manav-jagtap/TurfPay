{% extends "core/base.html" %}

{% block title %}Register | TurfPay{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <span class="eyebrow">JOIN TURFPAY</span>
        <h1>Create your account</h1>
        <p>Register as a customer and start booking turfs.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn primary full-btn">
                Create Account
            </button>
        </form>

        <div class="auth-bottom">
            Already registered?
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>
</section>
{% endblock %}
