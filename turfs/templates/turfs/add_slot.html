{% extends "core/base.html" %}

{% block title %}Add Slot | TurfPay{% endblock %}

{% block content %}
<section class="page narrow">
    <a href="{% url 'owner_dashboard' %}" class="back-link">&larr; Back to Dashboard</a>

    <div class="form-card">
        <span class="eyebrow">SLOT MANAGEMENT</span>
        <h1>Add Slot</h1>
        <p>{{ turf.name }}</p>

        <form method="post" class="styled-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn primary full-btn">Add Slot</button>
        </form>
    </div>
</section>
{% endblock %}
